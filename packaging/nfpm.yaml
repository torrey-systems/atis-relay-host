name: atis-relay-host
arch: all
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Torrey Systems <deploy@atisrelay.com>
homepage: https://atisrelay.com
description: |-
  ATIS Relay desktop app for Raspberry Pi
  Simple window to pick an airport, paste a station key, test the USB radio, and start sending ATIS clips.
depends:
  - python3 (>= 3.10)
  - python3-gi
  - gir1.2-gtk-3.0
  - python3-dotenv
  - python3-numpy
  - python3-requests
  - rtl-sdr
  - ffmpeg
  - alsa-utils
suggests:
  - python3-boto3
  - python3-flask
contents:
  - src: VERSION
    dst: /opt/pi-atc/VERSION
  - src: audio_uploader.py
    dst: /opt/pi-atc/audio_uploader.py
  - src: heartbeat.py
    dst: /opt/pi-atc/heartbeat.py
  - src: pi_atc_state.py
    dst: /opt/pi-atc/pi_atc_state.py
  - src: pi_atc_config.py
    dst: /opt/pi-atc/pi_atc_config.py
  - src: pi_atc_http.py
    dst: /opt/pi-atc/pi_atc_http.py
  - src: pi_atc_cli.py
    dst: /opt/pi-atc/pi_atc_cli.py
  - src: atis_relay_status.py
    dst: /opt/pi-atc/atis_relay_status.py
  - src: atis_relay_devices.py
    dst: /opt/pi-atc/atis_relay_devices.py
  - src: atis_relay_service.py
    dst: /opt/pi-atc/atis_relay_service.py
  - src: atis_relay_worker.py
    dst: /opt/pi-atc/atis_relay_worker.py
  - src: atis_relay_gui.py
    dst: /opt/pi-atc/atis_relay_gui.py
  - src: packaging/atis-relay
    dst: /usr/bin/atis-relay
    file_info:
      mode: 0755
  - src: packaging/atis-relay
    dst: /usr/bin/pi-atc
    file_info:
      mode: 0755
  - src: packaging/atis-relay.desktop
    dst: /usr/share/applications/atis-relay.desktop
  - src: packaging/atis-relay.svg
    dst: /usr/share/icons/hicolor/scalable/apps/atis-relay.svg
  - src: packaging/atis-relay.service
    dst: /usr/lib/systemd/user/atis-relay.service
  - src: README.md
    dst: /usr/share/doc/atis-relay-host/README.md
  - src: docs
    dst: /usr/share/doc/atis-relay-host/docs
  - src: packaging/copyright
    dst: /usr/share/doc/atis-relay-host/copyright
  - src: packaging/changelog.Debian.gz
    dst: /usr/share/doc/atis-relay-host/changelog.Debian.gz
  - src: packaging/lintian-overrides
    dst: /usr/share/lintian/overrides/atis-relay-host
scripts:
  postinstall: packaging/postinst
  preremove: packaging/prerm
  postremove: packaging/postrm
