name: package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-dotenv python3-requests python3-numpy
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  deb:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Install nfpm
        run: |
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.43.4/nfpm_2.43.4_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version
      - name: Build deb
        run: |
          mkdir -p dist
          gzip -9n -c packaging/changelog > packaging/changelog.Debian.gz
          VERSION="${{ steps.version.outputs.version }}" nfpm package \
            --config packaging/nfpm.yaml \
            --packager deb \
            --target dist/
          ls -l dist
      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: atis-relay-host-deb
          path: dist/atis-relay-host_*_all.deb
          if-no-files-found: error
      - name: Lintian and smoke install
        run: |
          set -eux
          DEB_FILE="$(basename "$(ls dist/atis-relay-host_*_all.deb)")"
          docker run --rm -i \
            -e "DEB_FILE=$DEB_FILE" \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/packaging/smoke-systemctl:/usr/local/src/smoke-systemctl:ro" \
            debian:bookworm-slim \
            bash -s <<'EOS'
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y lintian
          install -m 755 /usr/local/src/smoke-systemctl /usr/local/bin/systemctl
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 755 /usr/sbin/policy-rc.d
          lintian -i "/dist/${DEB_FILE}" | tee /tmp/lintian.log
          if grep -E '^E: ' /tmp/lintian.log | grep -vE 'no-manual-page|dir-or-file-in-opt'; then
            echo "lintian errors"
            exit 1
          fi
          apt-get install -y "/dist/${DEB_FILE}"
          test -x /usr/bin/atis-relay
          test -x /usr/bin/pi-atc
          test -f /usr/share/applications/atis-relay.desktop
          grep -q '^Name=ATIS Relay' /usr/share/applications/atis-relay.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/atis-relay.svg
          test -f /usr/lib/systemd/user/atis-relay.service
          test -f /opt/pi-atc/atis_relay_gui.py
          test ! -f /lib/systemd/system/pi-atc-setup.service
          test ! -f /etc/NetworkManager/conf.d/wifi-powersave-off.conf
          python3 -c 'import sys; sys.path.insert(0, "/opt/pi-atc"); import audio_uploader, heartbeat, pi_atc_config, atis_relay_status'
          out=$(printf 'smoke-token-not-for-prod\n' | HOME=/tmp/atis-smoke atis-relay set-key 2>&1) || true
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q smoke-token-not-for-prod; then
            echo "token leaked from set-key"
            exit 1
          fi
          test -f /tmp/atis-smoke/.config/atis-relay/env
          grep -q '^STATION_TOKEN=smoke-token-not-for-prod$' /tmp/atis-smoke/.config/atis-relay/env
          stat -c '%a' /tmp/atis-smoke/.config/atis-relay/env | grep -qx 600
          status_out=$(HOME=/tmp/atis-smoke atis-relay status 2>&1)
          printf '%s\n' "$status_out"
          if printf '%s\n' "$status_out" | grep -q smoke-token-not-for-prod; then
            echo "token leaked from status"
            exit 1
          fi
          printf '%s\n' "$status_out" | grep -qi 'token: set'
          EOS
      - name: Attach deb to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEB="$(ls dist/atis-relay-host_*_all.deb)"
          gh release create "${{ github.ref_name }}" "$DEB" \
            --title "${{ github.ref_name }}" \
            --notes "ATIS Relay host package for Raspberry Pi OS." \
            --repo "${{ github.repository }}" \
            || gh release upload "${{ github.ref_name }}" "$DEB" --clobber --repo "${{ github.repository }}"
